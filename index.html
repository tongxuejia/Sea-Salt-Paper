<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>海盐折纸 · Sea Salt &amp; Paper 网页版</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/cards.css">
</head>
<body>
<div id="app">

  <!-- 电脑对手区（顶部堆叠：AI1 在上、AI2 在下，仅 3 人局显示） -->
  <div id="ai-stack">
  <!-- AI 区 -->
  <section id="ai-zone">
    <div class="zone-head">
      <span class="pname" id="ai-pname">AI 对手</span>
      <span class="pstats">总分 <b id="ai-total">0</b> ｜ 面前 <b id="ai-table-score">0</b> 分 ｜ 手牌 <b id="ai-hand-count">0</b> 张</span>
    </div>
    <div id="ai-hand" class="hand-row"></div>
    <div id="ai-table" class="table-row"></div>
    <div id="ai-bubble"></div>
  </section>

  <!-- 第 2 个电脑对手（仅 3 人局显示）：紧跟 AI1 下方、同尺寸堆叠 -->
  <section id="ai2-zone" class="hidden">
    <div class="zone-head">
      <span class="pname" id="ai2-pname">AI2</span>
      <span class="pstats">总分 <b id="ai2-total">0</b> ｜ 面前 <b id="ai2-table-score">0</b> 分 ｜ 手牌 <b id="ai2-hand-count">0</b> 张</span>
    </div>
    <div id="ai2-hand" class="hand-row"></div>
    <div id="ai2-table" class="table-row"></div>
    <div id="ai2-bubble"></div>
  </section>
  </div>

  <!-- 中央：牌库与弃牌堆 -->
  <section id="center-zone">
    <div id="phase-bar"></div>
    <div id="turn-banner"></div>
    <div class="piles-block">
      <div class="piles-main">
        <div id="corner-btns">
          <button id="undo-btn" data-action="undo" title="悔棋：只能撤销本回合内的操作">↶</button>
        </div>
        <div class="piles">
          <div class="pile-wrap">
            <div id="deck" class="pile"></div>
            <div class="pile-label">牌库 <span id="deck-count"></span></div>
          </div>
          <div class="pile-wrap">
            <div id="discard-0" class="pile"></div>
            <div class="pile-label">弃牌堆 1</div>
          </div>
          <div class="pile-wrap">
            <div id="discard-1" class="pile"></div>
            <div class="pile-label">弃牌堆 2</div>
          </div>
        </div>
      </div>
      <div id="side-btns">
        <button id="quick-btn" data-action="toggleQuick" title="快速模式：点牌直接拿，不弹拿取气泡">⚡</button>
        <button id="rules-btn" data-action="rulebook" title="规则书">!</button>
        <button id="help-btn" data-action="help" title="规则速查">?</button>
      </div>
    </div>
    <div id="log"></div>
  </section>

  <!-- 玩家区 -->
  <section id="player-zone">
    <div id="call-bar"></div>
    <div id="duo-bar"></div>
    <div id="player-hand" class="hand-row"></div>
    <div id="player-table" class="table-row"></div>
    <div class="zone-head">
      <span class="pname">你</span>
      <span class="pstats">本轮 <b id="my-round-score">0</b> 分 ｜ 总分 <b id="my-total">0</b></span>
    </div>
  </section>

</div>

<div id="overlay" class="hidden"><div id="overlay-card"></div></div>
<div id="start-page" class="hidden"></div>

<script src="js/cards.js"></script>
<script src="js/rules.js"></script>
<script src="js/ai.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
